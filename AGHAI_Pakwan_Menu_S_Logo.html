const T=k=>(tr[db.lang]||tr.en)[k]||k;const localDayKey=value=>{const d=new Date(value);return Number.isNaN(d.getTime())?'':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const orderDayKey=o=>{const t=Number(o.time);if(Number.isFinite(t)&&t>0)return localDayKey(t);return /^\d{4}-\d{2}-\d{2}$/.test(o.date||'')?o.date:''};const dayOrders=value=>db.orders.filter(o=>orderDayKey(o)===localDayKey(value));const dateKey=()=>localDayKey(Date.now());const todayOrders=()=>dayOrders(Date.now());const totalSales=arr=>arr.reduce((s,o)=>s+(Number(o.total)||0),0);const fmtDate=x=>new Date(x).toLocaleString();
function showPage(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{db.lang=b.dataset.lang;save();document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x===b));render()});
function license(){let elapsed=Math.floor((Date.now()-db.trialStart)/86400000),left=Math.max(0,20-elapsed);let active=db.licenseUntil>Date.now();document.getElementById('licenseBadge').textContent=active?'LICENSE ACTIVE':left+' DAYS TRIAL';return {left,active,blocked:!active&&left<=0}}
function render(){document.getElementById('brandTitle').textContent=db.name;license();let m=document.getElementById('main');if(license().blocked&&page!=='settings'){m.innerHTML=`<div class="panel"><h2>Software Locked / Access Expired</h2><p class="muted">20 din ka trial mukammal ho gaya. Owner se activation PIN hasil karein.</p><button onclick="showPage('settings')">Admin Activation</button></div>`;return}if(page==='dashboard')dashboard(m);if(page==='counter')counter(m);if(page==='menu')menuPage(m);if(page==='sales')salesPage(m);if(page==='settings')settingsPage(m)}
function dashboard(m){let orders=todayOrders(),sales=totalSales(orders),all=db.orders.slice().reverse().slice(0,5),max=Math.max(1,...Array.from({length:7},(_,i)=>totalSales(dayOrders(Date.now()-i*86400000))));let bars=Array.from({length:7},(_,i)=>{let d=new Date(Date.now()-(6-i)*86400000),v=totalSales(dayOrders(d));return `<div class="bar" style="height:${v>0?Math.max(1,v/max*100):0}%"><span>${d.toLocaleDateString('en',{weekday:'short'})}</span></div>`}).join('');m.innerHTML=`<div class="pagehead"><div><p class="muted">WELCOME TO YOUR BUSINESS</p><h2>${T('dashboard')}</h2><p class="muted">${new Date().toLocaleDateString()}</p></div><button class="gold" onclick="showPage('counter')">＋ New Order</button></div><div class="grid"><div class="stat"><label>${T('today')}</label><strong>${money(sales)}</strong><small>Today's revenue</small></div><div class="stat"><label>${T('orders')}</label><strong>${orders.length}</strong><small>Saved transactions</small></div><div class="stat"><label>${T('avg')}</label><strong>${money(orders.length?sales/orders.length:0)}</strong><small>Per order</small></div><div class="stat"><label>${T('items')}</label><strong>${db.items.length}</strong><small>Active dishes</small></div></div><div class="columns"><section class="panel"><h3>Sales Overview · 7 Days</h3><div class="bars">${bars}</div></section><section class="panel"><h3>${T('quick')}</h3><div class="quick"><button onclick="showPage('counter')">＋ New Bill</button><button onclick="showPage('menu')">☷ Manage Menu</button><button onclick="printMenu()">▤ Menu Card Preview / PDF</button><button onclick="showPage('sales')">▥ Reports</button></div><h3 style="margin-top:22px">${T('popular')}</h3>${db.items.slice(0,5).map(x=>`<div class="switchline"><span>${x.en}</span><b>${money(x.price)}</b></div>`).join('')}</section></div><section class="panel" style="margin-top:15px"><h3>${T('reports')}</h3>${ordersTable(all)}</section>`}
function dishName(x){return db.lang==='ur'?x.ur:db.lang==='ro'?x.ro:x.en}
function menuPage(m){let list=db.items.filter(x=>(cat==='All'||x.cat===cat)&&[x.en,x.ur,x.ro,x.cat].join(' ').toLowerCase().includes(search.toLowerCase()));m.innerHTML=`<div class="pagehead"><div><h2><span class="inline-s">S</span> ${T('menu')}</h2><p class="muted">Dishes, sweets, portions aur rates manage karein</p></div><div class="quick"><button class="gold" onclick="printMenu()">▤ Menu Card Preview / PDF</button><button onclick="document.getElementById('addForm').classList.toggle('hidden')">＋ ${T('add')}</button></div></div><div class="panel hidden" id="addForm"><h3>${T('add')}</h3><div class="formgrid"><div class="field"><label>English Name</label><input id="newEn" placeholder="Chicken Biryani"></div><div class="field"><label>Urdu Name</label><input id="newUr" placeholder="چکن بریانی"></div><div class="field"><label>Roman Urdu</label><input id="newRo" placeholder="Chicken Biryani"></div><div class="field"><label>${T('category')}</label><select id="newCat">${cats.slice(1).map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>${T('price')} (Rs.)</label><input id="newPrice" type="number" min="0" value="100"></div><div class="field"><label>${T('portion')}</label><select id="newUnit"><option>plate</option><option>kg</option><option>gram</option><option>piece</option><option>packet</option><option>cup</option><option>tray</option><option>liter</option></select></div></div><button class="gold" onclick="addDish()">${T('save')}</button></div><div class="toolbar"><input placeholder="${T('search')}" value="${search}" oninput="search=this.value;menuPage(document.getElementById('main'))"><button class="soft" onclick="search='';menuPage(document.getElementById('main'))">Clear</button></div><div class="categoryrow">${cats.map(c=>`<button class="${cat===c?'active':''}" onclick="cat='${c}';menuPage(document.getElementById('main'))">${c}</button>`).join('')}</div><div class="menu-grid">${list.map(x=>`<div class="dish"><div class="dishname">${dishName(x)}</div><div class="sub">${x.en} · ${x.cat} · ${x.portion||x.unit}</div><div class="price">${money(x.price)} / ${x.unit}</div><div class="quick"><button class="soft" onclick="editDish(${x.id})">Edit</button><button class="danger" onclick="deleteDish(${x.id})">Delete</button></div></div>`).join('')||'<div class="empty">No dishes found</div>'}</div>`}
function addDish(){let en=document.getElementById('newEn').value.trim(),ur=document.getElementById('newUr').value.trim(),ro=document.getElementById('newRo').value.trim(),price=Number(document.getElementById('newPrice').value);if(!en||!price){alert('English name aur rate lazmi hain');return}let unit=document.getElementById('newUnit').value,portion=prompt('Portion name (Full / Half / Quarter / Plate / 1 Kg)', 'Full');if(portion===null)return;db.items.push({id:Date.now(),en,ur:ur||en,ro:ro||en,cat:document.getElementById('newCat').value,price,unit,portion:portion.trim()||unit});save();menuPage(document.getElementById('main'))}
function editDish(id){let x=db.items.find(a=>a.id===id);if(!x)return;let en=prompt('English name',x.en);if(en===null)return;let ur=prompt('Urdu name',x.ur);if(ur===null)return;let ro=prompt('Roman Urdu name',x.ro);if(ro===null)return;let catName=prompt('Category',x.cat);if(catName===null)return;let price=prompt('Rate (Rs.)',x.price);if(price===null||price.trim()===''||!Number.isFinite(Number(price))||Number(price)<0){alert('Valid rate enter karein');return}let unit=prompt('Unit (plate / kg / gram / piece / packet / cup)',x.unit);if(unit===null)return;let portion=prompt('Portion (Full / Half / Quarter / Plate / 1 Kg)',x.portion||x.unit);if(portion===null)return;x.en=en.trim()||x.en;x.ur=ur.trim()||x.en;x.ro=ro.trim()||x.en;x.cat=catName.trim()||x.cat;x.price=Number(price);x.unit=unit.trim()||x.unit;x.portion=portion.trim()||x.unit;save();menuPage(document.getElementById('main'))}function deleteDish(id){if(confirm('Delete this dish?')){db.items=db.items.filter(x=>x.id!==id);save();menuPage(document.getElementById('main'))}}
function counter(m){let list=db.items.filter(x=>(cat==='All'||x.cat===cat)&&[x.en,x.ur,x.ro].join(' ').toLowerCase().includes(search.toLowerCase()));m.innerHTML=`<div class="pagehead"><div><h2>${T('counterTitle')}</h2><p class="muted">Fast billing · portions · kg · packets</p></div><span class="tag">S SMART BILLING</span></div><div class="posgrid"><section class="panel"><div class="toolbar"><input placeholder="${T('search')}" value="${search}" oninput="search=this.value;counter(document.getElementById('main'))"></div><div class="categoryrow">${cats.map(c=>`<button class="${cat===c?'active':''}" onclick="cat='${c}';counter(document.getElementById('main'))">${c}</button>`).join('')}</div><div class="menu-grid">${list.map(x=>`<div class="dish"><div class="dishname">${dishName(x)}</div><div class="sub">${x.cat} · ${x.portion||x.unit}</div><div class="price">${money(x.price)} / ${x.unit}</div><button onclick="addCart(${x.id})">＋ Add</button></div>`).join('')}</div></section><section class="panel"><h3>${T('cart')}</h3><div class="field"><label>${T('customer')}</label><input id="customer" value="${db.customer}" oninput="db.customer=this.value;save()"></div><div class="field"><label>${T('orderType')}</label><select id="orderType" onchange="db.orderType=this.value;save()"><option ${db.orderType==='Dine In'?'selected':''}>Dine In</option><option ${db.orderType==='Take Away'?'selected':''}>Take Away</option><option ${db.orderType==='Delivery'?'selected':''}>Delivery</option></select></div><div id="cartItems">${cartHTML()}</div><div class="formgrid"><div class="field"><label>${T('discount')}</label><input type="number" min="0" value="${db.discount}" onchange="db.discount=Math.max(0,+this.value);save();counter(document.getElementById('main'))"></div><div class="field"><label>${T('gst')}</label><input type="number" min="0" value="${db.gst}" onchange="db.gst=Math.max(0,+this.value);save();counter(document.getElementById('main'))"></div></div><div class="totals" id="totals">${totalsHTML()}</div><div class="quick" style="margin-top:15px"><button class="gold" style="flex:1" onclick="completeOrder()">${T('pay')}</button><button class="soft" onclick="clearCart()">Clear</button></div></section></div>`}
function cartHTML(){return db.cart.length?db.cart.map((x,i)=>`<div class="cartline"><div><b>${x.name}</b><small>${x.unit} · ${money(x.price)} each</small><div class="qty"><button onclick="changeQty(${i},-1)">−</button>${x.qty}<button onclick="changeQty(${i},1)">＋</button><button class="danger" onclick="removeCart(${i})">×</button></div></div><b>${money(x.price*x.qty)}</b></div>`).join(''):'<div class="empty">Order abhi khali hai</div>'}
function totals(){let sub=db.cart.reduce((s,x)=>s+x.price*x.qty,0),disc=Math.min(sub,db.discount),tax=Math.max(0,sub-disc)*db.gst/100;return{sub,disc,tax,total:sub-disc+tax}}
function totalsHTML(){let t=totals();return `<div class="totalrow"><span>${T('subtotal')}</span><b>${money(t.sub)}</b></div><div class="totalrow"><span>${T('discount')}</span><b>− ${money(t.disc)}</b></div><div class="totalrow"><span>GST</span><b>${money(t.tax)}</b></div><div class="totalrow grand"><span>${T('total')}</span><b>${money(t.total)}</b></div>`}
function addCart(id){let x=db.items.find(a=>a.id===id),found=db.cart.find(a=>a.id===id);if(found)found.qty++;else db.cart.push({id:x.id,name:x.en,ur:x.ur,ro:x.ro,price:x.price,unit:x.unit,qty:1});save();counter(document.getElementById('main'))}function changeQty(i,d){db.cart[i].qty+=d;if(db.cart[i].qty<=0)db.cart.splice(i,1);save();counter(document.getElementById('main'))}function removeCart(i){db.cart.splice(i,1);save();counter(document.getElementById('main'))}function clearCart(){db.cart=[];db.discount=0;save();counter(document.getElementById('main'))}
function completeOrder(){if(!db.cart.length){alert('Pehle menu se item add karein');return}let t=totals(),o={id:'S'+Date.now().toString().slice(-7),time:Date.now(),date:dateKey(),customer:db.customer||'Walk-in Customer',type:db.orderType,items:db.cart.map(x=>({...x})),subtotal:t.sub,discount:t.disc,gst:t.tax,total:t.total};db.orders.push(o);db.lastOrder=o;db.cart=[];db.discount=0;save();counter(document.getElementById('main'));if(confirm('Bill save ho gaya. Print karein?'))printBill(o)}
function ordersTable(arr){return arr.length?`<div class="tablewrap"><table><thead><tr><th>Bill No.</th><th>Date / Time</th><th>Customer</th><th>Items</th><th>Total</th><th>Action</th></tr></thead><tbody>${arr.map(o=>`<tr><td>${o.id}</td><td>${fmtDate(o.time)}</td><td>${o.customer}</td><td>${o.items.reduce((s,x)=>s+x.qty,0)}</td><td><b>${money(o.total)}</b></td><td><button class="soft" onclick="printBillById('${o.id}')">Print</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Abhi koi sale record nahi</div>'}
function salesPage(m){let sum=totalSales(db.orders);m.innerHTML=`<div class="pagehead"><div><h2>${T('sales')}</h2><p class="muted">Complete transaction history</p></div><button class="gold" onclick="exportCSV()">⇩ ${T('export')}</button></div><div class="grid"><div class="stat"><label>Total Revenue</label><strong>${money(sum)}</strong></div><div class="stat"><label>Total Bills</label><strong>${db.orders.length}</strong></div><div class="stat"><label>Discount Given</label><strong>${money(db.orders.reduce((s,o)=>s+o.discount,0))}</strong></div><div class="stat"><label>GST Collected</label><strong>${money(db.orders.reduce((s,o)=>s+o.gst,0))}</strong></div></div><section class="panel" style="margin-top:15px"><h3>${T('reports')}</h3>${ordersTable(db.orders.slice().reverse())}</section>`}

function applyTheme(name){const t=aghaiThemes[name]||aghaiThemes.classic;const root=document.documentElement;Object.entries({'--site-primary':t.primary,'--site-on-primary':t.onPrimary,'--site-secondary':t.secondary,'--site-background':t.background,'--surface':t.surface,'--surface2':t.surface2,'--ink':t.ink,'--muted':t.muted,'--line':t.line,'--green':t.green,'--gold':t.gold}).forEach(([k,v])=>root.style.setProperty(k,v));document.body.dataset.theme=name;}

lass="panel"><h3>Business Profile</h3><div class="field"><label>${T('business')}</label><input id="businessName" value="${db.name}"></div><div class="field"><label>Currency</label><select id="currency"><option>Rs.</option><option>PKR</option></select></div><div class="field"><label>${T('pin')}</label><input id="ownerPin" type="password" value="${db.ownerPin}"></div><button class="gold" onclick="saveSettings()">Save Settings</button><div class="switchline"><span>Print language / bill mein teen zaban ke naam</span><span class="tag">EN · UR · ROMAN</span></div><div class="switchline"><span>Menu aur sales CSV export</span><button class="soft" onclick="exportCSV()">Export</button></div><div class="switchline"><span>Print menu</span><button class="soft" onclick="printMenu()">Print</button></div></section><section class="panel"><h3>License & Activation</h3><div class="notice">Demo security: 20 din ka local trial. Expiry ke baad app lock ho jata hai. Owner PIN se activation code banayein / customer ko dein.</div><div class="stat"><label>${T('days')}</label><strong>${l.active?'Active':l.left+' days left'}</strong><small>${l.active?'Activated until '+fmtDate(db.licenseUntil):'Trial starts on this device'}</small></div><div class="field"><label>Customer Device Activation Code</label><input id="activationCode" placeholder="Enter activation code"></div><button onclick="activateCode()">Activate Device</button><div class="field"><label>Owner PIN (default 7860) + License Code Generator</label><input id="licensePin" type="password" placeholder="Owner PIN"></div><div class="formgrid"><div class="field"><label>Days to activate</label><input id="licenseDays" type="number" value="365"></div><div class="field"><label>Generated code</label><input id="generatedCode" readonly placeholder="Code will show here"></div></div><div class="quick"><button class="gold" onclick="generateCode()">Generate Code</button><button class="soft" onclick="copyCode()">Copy Code</button></div><p class="muted" st cing:1.5px;margin-top:4px}</style><div class="smart-bill"><div class="bill-head"><div class="bill-s">S</div><h1>${db.name}</h1><div class="bill-tag">✦ QUALITY FOOD • GREAT TASTE ✦</div><div class="bill-meta"><b>${o.type} BILL</b> · ${o.id}<br>${fmtDate(o.time)}<br>Customer: ${o.customer||'Walk-in Customer'}</div></div><div class="bill-label">ORDER DETAILS</div><table><thead><tr><th>Item</th><th>Qty</th><th>Amount</th></tr></thead><tbody>${rows}</tbody></table><div class="bill-totals"><div class="sum"><span>Subtotal</span><b>${money(o.subtotal)}</b></div><div class="sum"><span>Discount</span><b>${money(o.discount)}</b></div><div class="sum"><span>GST</span><b>${money(o.gst)}</b></div><div class="sum grand"><span>NET TOTAL</span><b>${money(o.total)}</b></div></div><div class="bill-thanks"><b>Thank You! Shukriya</b><small>PLEASE VISIT AGAIN</small></div></div>`;printPreview('Smart Bill '+o.id,db.counterSettings?.receiptWidth||'80',html)}

 const html=`<style>

 .menu-subtitle{font:italic 10px Georgia,serif;color:#76613a;margin:9px 0 0}

 .menu-category h2 small{margin-left:auto;color:#ead7ac;font:7px Arial,sans-serif;letter-spacing:1px}
 .cat-mark{color:#e4c27c;font-size:12px}

 .dish-photo{width:58px;height:48px;flex:0 0 58px;object-fit:cover;border-radius:8px;border:1px solid #d7bd80;box-shadow:0 2px 5px #173d3520;background:#eee7d8}
 .dish-copy{min-width:0;flex:1}.dish-copy strong{display:block;font:bold 10px Arial,sans-serif;line-height:1.25;color:#26362e;overflow-wrap:anywhere}

 .menu-note{text-align:center;margin:3mm 0 0;padding:8px;background:#f8f3e8;border:1px solid #e6d8b9;border-radius:5px;color:#725d34;font:8px Arial,sans-serif}
 .menu-footer{text-align:center;margin-top:5mm;padding-top:8px;border-top:1px solid #d9c89f;color:#80642f;font:bold 8px Arial,sans-serif;letter-spacing:1.2px}
 @media print{.menu-category,.menu-dish{break-inside:avoid}.dish-photo{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

 printPreview('AGHAI Smart Premium Menu Card','A4',html)
